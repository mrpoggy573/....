<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padlock Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Lock Screen Container */
        .lock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: all 0.5s ease-in-out;
        }

        .lock-container.hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            position: absolute;
        }

        .padlock-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ffb703;
            transition: transform 0.3s;
        }

        /* Combination Wheels */
        .wheels-wrapper {
            display: flex;
            gap: 12px;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 12px;
            border: 2px solid #333;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .wheel-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 45px;
        }

        .wheel {
            width: 100%;
            height: 60px;
            background: #2a2a2a;
            border-radius: 6px;
            border: 2px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #888;
            transition: all 0.1s ease;
        }

        /* Active column styling */
        .wheel-column.active .wheel {
            color: #00adb5;
            border-color: #00adb5;
            box-shadow: 0 0 10px rgba(0, 173, 181, 0.3);
            transform: scale(1.05);
        }

        .nav-hint {
            font-size: 0.85rem;
            color: #666;
            margin-top: 10px;
            text-align: center;
            line-height: 1.4;
        }

        /* Unlocked Content (Centered Secret) */
        .secret-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .secret-content.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .date-display {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .time-display {
            font-size: 2.5rem;
            font-weight: 400;
            color: #00adb5;
            text-shadow: 0 0 15px rgba(0, 173, 181, 0.4);
        }
    </style>
</head>
<body>

    <!-- LOCK SCREEN interface -->
    <div class="lock-container" id="lockScreen">
        <div class="padlock-icon" id="lockIcon">🔒</div>
        <div class="wheels-wrapper" id="wheelsWrapper">
            <!-- 6 lock wheels generated by JavaScript -->
        </div>
        <div class="nav-hint">
            Use <strong>Left / Right Arrows</strong> to switch numbers.<br>
            Use <strong>Up / Down Arrows</strong> to change values (0-9).
        </div>
    </div>

    <!-- SECRET UNLOCKED DISPLAY (Centered) -->
    <div class="secret-content" id="secretContent">
        <div class="date-display">09/01/26</div>
        <div class="time-display">6:30 EST</div>
    </div>

    <script>
        const targetCode =;
        let currentDigits =;
        let activeIndex = 0;
        let isUnlocked = false;

        const wheelsWrapper = document.getElementById('wheelsWrapper');
        const lockScreen = document.getElementById('lockScreen');
        const lockIcon = document.getElementById('lockIcon');
        const secretContent = document.getElementById('secretContent');

        // Create the combinations wheels dynamically
        function createWheels() {
            wheelsWrapper.innerHTML = '';
            currentDigits.forEach((digit, index) => {
                const column = document.createElement('div');
                column.className = `wheel-column ${index === activeIndex ? 'active' : ''}`;
                
                const wheel = document.createElement('div');
                wheel.className = 'wheel';
                wheel.textContent = digit;
                
                column.appendChild(wheel);
                wheelsWrapper.appendChild(column);
            });
        }

        // Update wheel visual states and check the combination code
        function updateWheels() {
            if (isUnlocked) return;

            const columns = document.querySelectorAll('.wheel-column');
            columns.forEach((col, index) => {
                if (index === activeIndex) {
                    col.classList.add('active');
                } else {
                    col.classList.remove('active');
                }
                col.querySelector('.wheel').textContent = currentDigits[index];
            });

            // Check if the current digits match the secret target code
            if (JSON.stringify(currentDigits) === JSON.stringify(targetCode)) {
                triggerUnlock();
            }
        }

        // Unlocking sequence animation logic
        function triggerUnlock() {
            isUnlocked = true;
            lockIcon.textContent = '🔓';
            lockIcon.style.transform = 'scale(1.3)';
            
            setTimeout(() => {
                lockScreen.classList.add('hidden');
                secretContent.classList.add('show');
            }, 600);
        }

        // Listen for Keyboard Navigation Inputs
        window.addEventListener('keydown', (e) => {
            if (isUnlocked) return;

            switch(e.key) {
                case 'ArrowLeft':
                    if (activeIndex > 0) activeIndex--;
                    updateWheels();
                    break;
                case 'ArrowRight':
                    if (activeIndex < currentDigits.length - 1) activeIndex++;
                    updateWheels();
                    break;
                case 'ArrowUp':
                    currentDigits[activeIndex] = (currentDigits[activeIndex] + 1) % 10;
                    updateWheels();
                    break;
                case 'ArrowDown':
                    currentDigits[activeIndex] = (currentDigits[activeIndex] - 1 + 10) % 10;
                    updateWheels();
                    break;
            }
        });

        // Initialize display setup
        createWheels();
    </script>
</body>
</html>
